# Local development / self-hosted deployment.
# For production, supply secrets via Docker secrets or an uncommitted .env.

services:
  app:
    image: ghcr.io/dfalling/tareas:latest
    build: .
    restart: unless-stopped
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: "postgres://tareas:password@db:5432/tareas?sslmode=disable"
      APP_TIMEZONE: "UTC"
      APP_LOCALE: "en"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tareas
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tareas
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tareas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
