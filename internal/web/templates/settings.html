{{define "content"}}
<h1>{{.T "settings_title"}}</h1>
{{with .Error}}<p class="error">{{.}}</p>{{end}}
<form method="post" action="/settings" class="stack">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <label for="auto_delete_days">{{.T "settings_auto_delete_label"}}</label>
    <input type="number" id="auto_delete_days" name="auto_delete_days" value="{{.Settings.AutoDeleteDays}}"
           min="1" max="3650" step="1">
    <p class="intro">{{.T "settings_auto_delete_hint"}}</p>
    <div class="row">
        <button type="submit">{{.T "settings_save"}}</button>
        <a href="/todos" class="button">{{.T "edit_cancel"}}</a>
    </div>
</form>
{{end}}
