version: "2"

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - gosec
  exclusions:
    rules:
      # i18n catalogs are UI strings; gosec's credential heuristic (G101)
      # false-positives on keys like "login_password_label".
      - path: i18n\.go
        linters:
          - gosec
        text: "G101"
      # Test helpers only ever request the local httptest server.
      - path: _test\.go
        linters:
          - gosec
        text: "G704"
      # PRG redirects carry the current tab through, but the ?view= value is
      # whitelisted by todos.ParseView (a fixed set of constants) before it
      # reaches the target, so gosec's open-redirect taint analysis (G710)
      # cannot see the sanitization and false-positives on handlers.go.
      - path: handlers\.go
        linters:
          - gosec
        text: "G710"
      # The healthcheck helper probes the address its own container's server
      # listens on; LISTEN_ADDR is operator-supplied env — the same source the
      # server itself binds — so gosec's SSRF taint analysis (G704) flags a
      # request that is tautologically local.
      - path: cmd/healthcheck/main\.go
        linters:
          - gosec
        text: "G704"

formatters:
  enable:
    - gofumpt
